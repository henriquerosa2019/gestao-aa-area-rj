.brand-mark {

  font-size: 11.5px;

  border-radius: 5px;

  transition: background 0.15s, border-color 0.15s;

}
.btn-header-action:hover { background: #2a3a3e; border-color: var(--gold-light); color: var(--gold-light); }

.restore-banner-erro { background: #3a1f1f; color: #d8a8a8; }
.restore-banner-close {

}
.restore-banner-close:hover { opacity: 1; }
